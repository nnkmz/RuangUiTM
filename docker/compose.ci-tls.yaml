# Disposable CI only. Use real certificates and your own proxy on a dev server.
services:
  php:
    environment:
      COOKIE_SECURE: '1'
  tls:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8443:443'
      - '127.0.0.1:8082:80'
    volumes:
      - ./docker/ci/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ci/certs:/etc/nginx/ci-certs:ro
    depends_on:
      - web
